services:
  redis:
    image: redis/redis-stack-server:latest
    command: redis-stack-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  studio:
    image: ai-creative-studio:latest
    build: .
    gpus: all
    depends_on:
      - redis
    ports:
      - "8080:8080"
    environment:
      HF_HOME: /models/hf
      HUGGINGFACE_HUB_CACHE: /models/hf/hub
      TRANSFORMERS_CACHE: /models/hf/hub
      HF_TOKEN: ${HF_TOKEN:-}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TOKENIZERS_PARALLELISM: "false"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - /mnt/evo4tb/evdokimov/.hf_cache:/models/hf
      - ./config.yaml:/app/config.yaml:ro
      - ./generated:/app/generated

volumes:
  redis-data:
