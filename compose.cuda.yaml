services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  redis:
    image: redis/redis-stack-server:latest
    command: redis-stack-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  studio:
    image: ai-creative-studio:latest
    build: .
    gpus: all
    depends_on:
      - redis
      - minio
    ports:
      - "8080:8080"
    environment:
      HF_HOME: /models/hf
      HUGGINGFACE_HUB_CACHE: /models/hf/hub
      TRANSFORMERS_CACHE: /models/hf/hub
      HF_HUB_CACHE: /models/hf/hub
      HF_XET_CACHE: /models/hf/xet
      TORCH_HOME: /models/hf/torch
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_TOKEN: ${HF_TOKEN:-}
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      TOKENIZERS_PARALLELISM: "false"
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: studio-uploads
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /mnt/evo4tb/evdokimov/.hf_cache:/models/hf
      - ./config.yaml:/app/config.yaml:ro
      - ./generated:/app/generated

volumes:
  redis-data:
  minio-data:
