# Model and service configuration
# Optimized for Apple Silicon M1 8GB RAM
#
# Memory strategy on 8GB unified RAM: ONE big VLM + ONE LLM loaded at a time.
# Therefore we intentionally use the same VLM (Qwen2-VL-2B-4bit) for THREE tasks:
#   1) Input product image analysis (VLM analyzer)
#   2) Generated-image scoring (replaces CLIP; extra model = more OOM risk)
#   3) Optional image captioning.
#
# For pure text tasks (concepts, scoring, prompt refinement) we keep the lighter
# text-only Qwen2.5-3B-4bit because it is faster + slightly better at reasoning.

llm:
  mlx_model: mlx-community/Qwen2.5-3B-Instruct-4bit
  cuda_model: Qwen/Qwen2.5-3B-Instruct
  max_tokens: 800         # raised from 500 — product analysis + refinement need more tokens
  temperature: 0.7

vlm:
  # Vision model used for: input product analysis, generated-image scoring, captioning.
  # On 8GB M1 you MUST use 4-bit quant. Qwen2-VL-2B works; 7B will OOM.
  mlx_vlm_model: mlx-community/Qwen2-VL-2B-Instruct-4bit
  cuda_model: Qwen/Qwen2-VL-2B-Instruct
  max_tokens: 900

diffusion:
  # sdxl | kandinsky5 — same LangGraph input (product photo + LLM prompts).
  # sdxl: ControlNet / IP-Adapter. kandinsky5: I2I (photo → Qwen2.5-VL + DiT), no IP-Adapter.
  backend: kandinsky5
  # Default: SDXL-Turbo (~7GB download, 4 steps). FLUX.1-schnell is ~20GB+ and too heavy on disk.
  # Options: sdxl-turbo | sdxl | schnell | dev | kandinsky5
  model: kandinsky5
  quantize: 4
  # Turbo is trained at 512; 768+ needs more RAM. Full SDXL can use 768 on 8GB.
  width: 512
  height: 512
  num_inference_steps: 4
  guidance_scale: 0.0
  output_dir: generated
  # LoRA is off until you train weights and set enabled: true
  lora:
    enabled: false
    path: lora/xyz_hoodie
    scale: 0.8
    trigger: ""
  # Canny = product silhouette (geometry). OpenPose+Depth = clothing pose (set modes back).
  # Canny reads the product photo, not pose_ref.
  controlnet:
    enabled: true
    modes: [canny]
    canny_scale: 0.5
    canny_low: 60
    canny_high: 160
    openpose_scale: 0.0
    depth_scale: 0.0
    save_maps: true
    image: ""
    canny_image: ""
    canny_align: left                         # left | center | right — bottle on landscape
  ip_adapter:
    enabled: true
    scale: 0.5
    image: ""
    pad_square: true
    match_aspect: true
    max_aspect: 1.333
    canvas: landscape                         # product | landscape | square
  kandinsky:
    model: kandinskylab/Kandinsky-5.0-I2I-Lite-sft-Diffusers
    num_inference_steps: 50
    guidance_scale: 3.5
    width: 768
    height: 1280

pipeline:
  # How many concepts to generate from LLM
  num_concepts: 5
  # How many TOP concepts to actually draw (keep low for 8GB)
  top_k_concepts: 2
  # Evaluation threshold (0.0 = always end, no retries on 8GB to save time)
  # Increase to e.g. 0.70 once you're happy with setup and want to enable the
  # improve_prompt → refine_prompts → generation retry loop
  quality_threshold: 0.0
  # Max retries for prompt improvement (0 = disable retries on 8GB)
  # Raise together with quality_threshold once stable.
  max_retries: 0

ranking:
  # CLIP-T (prompt), CLIP-I (vs product photo), LAION aesthetic on CLIP ViT-L/14
  clip: true
  aesthetic: true
  # DINOv2-small: appearance/identity vs product photo (better than CLIP-I for garments)
  dino: true
  dino_model: facebook/dinov2-small
  # 2B VLM-as-judge is a future slot — noisy on Qwen2-VL-2B, keep off by default
  vlm_judge: false
  # When vlm_judge is true: run VLM only on images that already look good to CLIP.
  vlm_gate:
    min_clip_t: 0.55
    min_clip_i: 0.45      # ignored if there is no product photo
    min_pre_score: 0.55   # CLIP+aesthetic+heuristics blend before VLM
    top_k: 1              # at most this many images go to VLM
  clip_model: openai/clip-vit-large-patch14
  weights:
    clip_t: 0.30
    clip_i: 0.15
    dino_i: 0.20
    aesthetic: 0.15
    vlm: 0.10
    heuristics: 0.10

